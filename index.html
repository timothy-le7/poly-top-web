function adjacentTiles(t){const tiles=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){const n=tileAt(t.x+dx,t.y+dy);if(n)tiles.push(n)}return tiles}
function waterTile(t){return t&&['water','ocean'].includes(t.terrain)&&!t.frozen&&!t.bridge}
function unitDef(u){return u.boat?{...NAVAL[u.boat],swim:true,naval:true,super:TYPES[u.type].super||u.type==='giant',icon:'boat'}:TYPES[u.type]}
function monumentInfo(key,id=0){return key==='peace'&&faction(id).tribe==='spore'?{name:'Listening Grove',task:'Converter',description:'Convert 3 enemy units with Shamans.',icon:'flag'}:MONUMENTS[key]}
function initializeRuleState(){
 for(const f of game.factions){f.tasks??={kills:f.id===0?game.kills:0,conversions:0,peaceTurns:0,attacked:false,unlocked:[],built:[]};f.tasks.kills=Math.max(f.tasks.kills,f.id===0?game.kills:0)}
 game.peace??=[];game.ruleEvents??=0;for(const f of game.factions)if(f.id>0)f.explored??=Array(game.size*game.size).fill(false);
}
function homeCapital(id){return game.cities.find(c=>c.capital&&c.originalOwner===id&&c.owner===id)}
function discoveredLighthouses(id){return game.tiles.filter(t=>t.building==='lighthouse'&&t.discoveredBy?.includes(id)).length}
function productionLevel(t){const d=PRODUCTION[t.building];return d?adjacentTiles(t).filter(n=>n.building===d.source).length:0}
function marketIncome(t){return Math.min(8,adjacentTiles(t).reduce((n,a)=>n+productionLevel(a),0))}
function updateProduction(){
 for(const t of game.tiles){const d=PRODUCTION[t.building];if(!d)continue;const c=game.cities.find(c=>c.id===t.cityId);if(!c||c.owner<0)continue;const population=productionLevel(t)*d.population;t.productionPopulation??=population;if(population!==t.productionPopulation){const delta=population-t.productionPopulation;t.productionPopulation=population;addPopulation(c,delta)}}
}
function sanctuaryIncome(t){return t.owner<0?0:adjacentTiles(t).filter(n=>n.owner===t.owner&&n.terrain==='forest'&&!n.building&&n.resource==='animal').length}
function buildingPopulation(t){return t.building==='fungi'?t.fungiLevel:PRODUCTION[t.building]?t.productionPopulation??productionLevel(t)*PRODUCTION[t.building].population:({farm:2,mine:2,lumber:1,port:1,temple:1,monument:3})[t.building]||0}
function buildingCost(t){return t.buildCost??({farm:5,fungi:5,mine:5,lumber:3,port:7,windmill:5,sawmill:5,forge:5,market:5,sanctuary:5,temple:t.terrain==='forest'?15:20,monument:0})[t.building]??0}
function removeBuilding(t){const c=game.cities.find(c=>c.id===t.cityId),population=buildingPopulation(t);t.building=null;for(const key of ['productionPopulation','builtTurn','buildCost','fungiLevel','growthTurn','animalTurn','decomposeOwner','monument','monumentBuilder'])delete t[key];if(c&&population)addPopulation(c,-population)}
function finishBuildings(id){for(const t of game.tiles.filter(t=>t.decomposeOwner===id)){const cost=buildingCost(t);removeBuilding(t);faction(id).stars+=cost;emit(t.x,t.y,'+'+cost+' ★','#efdda0')}updateProduction();updateConnections(id)}
function advanceBuildings(id){
 floorRevision++;
 for(const t of game.tiles.filter(t=>t.owner===id)){
  if(t.building==='fungi'&&t.growthTurn<game.turn){const maximum=faction(id).tribe==='spore'&&ownsTech(id,'construction')?3:2;if(t.fungiLevel<maximum){t.fungiLevel++;const c=game.cities.find(c=>c.id===t.cityId);if(c)addPopulation(c,1)}t.growthTurn=game.turn}
  if(t.building==='sanctuary'&&game.turn-t.animalTurn>=2){t.animalTurn=game.turn;const candidates=adjacentTiles(t).filter(n=>n.owner===id&&n.terrain==='forest'&&!n.resource&&!n.building);if(candidates.length){const random=ruleRandom(0x3915261),n=candidates[Math.floor(random()*candidates.length)];n.resource='animal';if(id===0)emit(n.x,n.y,'WILD ANIMAL','#e8c5ef')}}
 }updateProduction();updateConnections(id);updateTasks(id);
}
function connectionNetwork(id){
 const capital=homeCapital(id),connected=new Set();if(!capital)return connected;
 const route=t=>t&&(t.owner===id||t.owner===-1)&&(!unitAt(t.x,t.y)||unitAt(t.x,t.y).owner===id)&&(t.road||t.bridge||cityAt(t.x,t.y)?.owner===id||t.building==='port'&&t.owner===id);
 const queue=[tileAt(capital.x,capital.y)],visited=new Set([tileIndex(capital.x,capital.y)]);
 function enqueue(t){const i=tileIndex(t.x,t.y);if(!visited.has(i)){visited.add(i);queue.push(t)}}
 for(let i=0;i<queue.length;i++){
  const t=queue[i],c=cityAt(t.x,t.y);if(c?.owner===id)connected.add(c.id);
  for(const n of adjacentTiles(t))if(route(n))enqueue(n);
  if(t.building!=='port')continue;
  // Sea links span no more than four water tiles and never cross hostile borders.
  const sea=[{t,steps:0}],seaSeen=new Set([tileIndex(t.x,t.y)]);
  for(let j=0;j<sea.length;j++){const p=sea[j];for(const n of adjacentTiles(p.t)){
   const index=tileIndex(n.x,n.y);if(seaSeen.has(index)||n.owner>=0&&n.owner!==id)continue;
   if(route(n)&&(n.building==='port'||cityAt(n.x,n.y)?.owner===id))enqueue(n);
   if(waterTile(n)&&p.steps<4){seaSeen.add(index);sea.push({t:n,steps:p.steps+1})}
  }}
 }
 return connected;
}
function updateConnections(id){
 const capital=homeCapital(id),connected=connectionNetwork(id),cities=game.cities.filter(c=>c.owner===id),links=cities.filter(c=>c.id!==capital?.id&&connected.has(c.id)).length;
 for(const c of cities){const wasConnected=c.connected;c.connected=connected.has(c.id)&&c.id!==capital?.id;const population=c.id===capital?.id?links:c.connected?1:0,delta=population-(c.connectionPopulation||0);c.connectionPopulation=population;c.connectionRewardedBy??=[];if(c.connected&&!c.connectionRewardedBy.includes(id))c.connectionRewardedBy.push(id);if(delta)addPopulation(c,delta);if(c.connected&&!wasConnected&&id===0)emit(c.x,c.y,'CONNECTED','#fff0a5')}
}
function updateTasks(id=0){
 const f=faction(id);if(!f||f.eliminated)return;const task=f.tasks;
 const conditions={peace:f.tribe==='spore'?task.conversions>=3:ownsTech(id,'meditation')&&task.peaceTurns>=5,wisdom:Object.keys(TECHS).every(k=>ownsTech(id,k)),bazaar:connectionNetwork(id).size>=6,tomb:ownsTech(id,'trade')&&f.stars>=100,power:task.kills>=10,fortune:game.cities.some(c=>c.owner===id&&c.level>=5),eye:discoveredLighthouses(id)===4};
 for(const [key,complete]of Object.entries(conditions))if(complete&&!task.unlocked.includes(key)){task.unlocked.push(key);if(id===0)toast(monumentInfo(key,id).name+' unlocked! Build it inside your borders.')}
}
function finishFactionTurn(id){
 const f=faction(id),task=f.tasks;if(ownsTech(id,'meditation'))task.peaceTurns=task.attacked?0:task.peaceTurns+1;else task.peaceTurns=0;task.attacked=false;updateTasks(id);
 // Units that took no action recover automatically; manual recovery remains available.
 for(const u of game.units.filter(u=>u.owner===id&&!u.moved&&!u.attacked&&!u.frozen&&!u.stunned))healUnit(u,tileAt(u.x,u.y).owner===id?4:2)

}
function growUnit(u){
 const d=TYPES[u.type];if(!d.growsInto||u.frozen||u.stunned)return false;u.growthTurns=Math.min(d.growthTime,(u.growthTurns||0)+1);if(u.growthTurns<d.growthTime||u.boat)return false;
 const damage=maxHP(u)-u.hp;u.type=d.growsInto;u.hp=Math.max(1,maxHP(u)-damage);delete u.growthTurns;delete u.anim;delete u.healthEffect;if(TYPES[u.type].growsInto)u.growthTurns=0;revealUnit(u);if(u.owner===0||seen(tileAt(u.x,u.y)))emit(u.x,u.y,TYPES[u.type].name.toUpperCase(),'#f2c7ef');return true;
}
function claimLighthouse(t,id){
 t.discoveredBy??=[];if(t.discoveredBy.includes(id))return;t.discoveredBy.push(id);const capital=homeCapital(id);if(capital)addPopulation(capital,1);if(id===0)emit(t.x,t.y,'LIGHTHOUSE +1 POP','#fff4b1');updateTasks(id);
}

function canPromote(u){return !u.boat&&!u.veteran&&u.kills>=3&&u.type!=='giant'&&!TYPES[u.type].super&&!['mindbender','siren','shaman','bloomguard','frostling'].includes(u.type)}
function promote(u){if(busy||game.over||isAnimating()||u.owner!==0||!canPromote(u))return;u.veteran=true;u.hp=maxHP(u);emit(u.x,u.y,'VETERAN!','#ffeba0');sound('research');updateUI();save()}
function peacePair(a,b){return game.peace.find(p=>p.a===Math.min(a,b)&&p.b===Math.max(a,b))}
function hostile(a,b){return a!==b&&!peacePair(a,b)}
function expirePeace(){game.peace=game.peace.filter(p=>p.breakTurn==null||game.turn<=p.breakTurn)}
function offerPeace(id){
 if(busy||game.over||isAnimating()||faction(id).eliminated)return;if(!ownsTech(0,'diplomacy')){openTech('diplomacy');return}
 const pair=peacePair(0,id);if(pair){if(pair.breakTurn!=null)return;pair.breakTurn=game.turn;toast('Treaty ends at the start of your next turn.')}else{
  const recent=Math.max(faction(0).lastAttacked?.[id]??-100,faction(id).lastAttacked?.[0]??-100);if(recent!=null&&game.turn-recent<2){toast('Wait one full turn after hostilities before offering peace.');return}
  game.peace.push({a:0,b:id});toast(tribeFor(id).name+' accepted peace.');
 }updateUI();save();openDiplomacy();

 if(!game.over)return;const win=game.winner===0,chronicle=game.mode==='chronicle',rating=dominationRating(),award=rating.total>=95?3:rating.total>=70?2:rating.total>=20?1:0;
 const heading=!win?'Defeat':chronicle?score().toLocaleString()+' points':rating.total.toFixed(1)+'%',label=!win?'YOUR LAST CITY WAS LOST':chronicle?'BASE SCORE':'THE CONCLAVE RATING';
 openModal(`<div class="game-result"><div class="outcome-icon">${icon(win?'trophy':'shield')}</div><span class="eyebrow">${label}</span><h2>${heading}</h2><p class="subtitle">${chronicle?'Your civilization after '+game.turn+' turns.':win?'Victory · '+('★'.repeat(award)||'No stars')+(rating.total===100?' · Perfect conquest':''):'Your tribe has fallen.'}</p>${chronicle?scoreRows():ratingRows()}<div class="result-grid"><div><b>${game.turn}</b><small>TURNS PLAYED</small></div><div><b>${game.kills}</b><small>ENEMIES DEFEATED</small></div><div><b>${game.losses||0}</b><small>UNITS LOST</small></div></div>${chronicle?'<p class="save-label">Renown rewards exploration, spellcraft and your sanctums.</p>':''}<button class="large-button" id="result-new">${icon('new')}Play again</button><button class="large-button secondary" id="result-view">${icon('eye')}Explore the world</button></div>`,'Game result');$('result-new').onclick=openNewGame;$('result-view').onclick=()=>closeModal(true);sound(win?'victory':'turn');updateUI();
}
function openStats(){
 openModal(modalCloseButton()+'<span class="eyebrow">'+game.mode.toUpperCase()+' · TURN '+game.turn+'</span><h2>Chronicle</h2><p class="subtitle">'+tribeFor(0).name+' · '+(MAP_TYPES[game.mapType]?.name||'Legacy map')+' · '+game.size*game.size+' tiles<br>'+playerCities().length+' cities · '+income(0)+' stars per turn</p>'+scoreRows()+(game.mode==='conclave'?'<span class="eyebrow">CONQUEST RATING · '+dominationRating().total.toFixed(1)+'%</span>'+ratingRows():'')+'<button class="menu-item" id="stats-monuments">'+icon('trophy')+'<span>Monuments</span><small>'+faction(0).tasks.unlocked.length+'/7 unlocked</small></button><button class="menu-item" id="stats-diplomacy">'+icon('flag')+'<span>Diplomacy</span>'+icon('chevron')+'</button><div class="stats-list">'+game.factions.map(f=>'<div class="stats-row"><div class="portrait">'+tribePortrait(f.tribe,f.id)+'</div><strong>'+factionName(f.id)+'</strong><small>'+(f.eliminated?'Defeated':game.cities.filter(c=>c.owner===f.id).length+' cities<br>'+game.units.filter(u=>u.owner===f.id).length+' units')+'</small></div>').join('')+'</div><button class="large-button" id="stats-done">Back to game</button>','Game statistics');$('stats-done').onclick=()=>closeModal();$('stats-monuments').onclick=()=>openMonuments();$('stats-diplomacy').onclick=openDiplomacy;
}
$('stats-button').onclick=openStats;$('menu-button').onclick=openMenu;$('tech-button').onclick=()=>openTech();$('end-turn').onclick=endTurn;$('close-tech').onclick=closeTech;$('next-unit').onclick=nextUnit;
$('center-map').onclick=()=>{const c=playerCities().find(c=>c.capital)||playerCities()[0];if(c){focusOn(c.x,c.y,true);sound()}};$('zoom-in').onclick=()=>zoomMap(1.2);$('zoom-out').onclick=()=>zoomMap(1/1.2);$('dismiss-tutorial').onclick=()=>{prefs.hint=false;$('tutorial').style.display='none';save()};
$('modal-layer').addEventListener('click',e=>{if(e.target===$('modal-layer')&&!upgradeQueue.length)closeModal()});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'){const open=$('tech-layer').classList.contains('open')?$('tech-layer'):$('modal-layer').classList.contains('open')?$('modal'):null;if(open){const elements=[...open.querySelectorAll('button:not(:disabled),select,[tabindex="0"]')],first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}
 if(e.key==='Escape'){if($('tech-layer').classList.contains('open'))closeTech();else if($('modal-layer').classList.contains('open'))closeModal();else{selected=null;updateSelection()}return}
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('modal-layer').classList.contains('open')||$('tech-layer').classList.contains('open'))return;
 if(e.key.toLowerCase()==='t')openTech();if(e.key.toLowerCase()==='e'){e.preventDefault();endTurn()}if(e.key.toLowerCase()==='c')$('center-map').click();if(e.key==='+'||e.key==='=')zoomMap(1.15);if(e.key==='-')zoomMap(1/1.15);if(e.key.startsWith('Arrow'))cameraMotion=panMotion=null;if(e.key==='ArrowLeft'){e.preventDefault();view.x+=35}if(e.key==='ArrowRight'){e.preventDefault();view.x-=35}if(e.key==='ArrowUp'){e.preventDefault();view.y+=35}if(e.key==='ArrowDown'){e.preventDefault();view.y-=35}requestRender();saveViewSoon();
});
new ResizeObserver(()=>{resize();render()}).observe($('stage'));resize();
function refreshResolution(){resize();requestRender()}
window.addEventListener('resize',refreshResolution);window.visualViewport?.addEventListener('resize',refreshResolution);
function watchResolution(){const query=matchMedia('(resolution: '+(window.devicePixelRatio||1)+'dppx)');query.addEventListener('change',()=>{refreshResolution();watchResolution()},{once:true})}watchResolution();
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearBattlePreview();panMotion=cameraMotion=null;save();cancelAnimationFrame(frameId);frameId=0;clearTimeout(idleFrameTimer);pointerState.clear();gesture=null;canvas.classList.remove('dragging')}else{requestRender();if(game.turnState&&!busy&&!game.over)resumeTurn()}});
window.addEventListener('pagehide',save);

const LORE_COPY={tribe:'circle',tribes:'circles',city:'sanctum',cities:'sanctums',village:'waystation',villages:'waystations',stars:'lumen',population:'resonance',civilization:'circle',civilizations:'circles',technology:'spellcraft',technologies:'spells',warrior:'apprentice',warriors:'apprentices',archers:'boltweavers',riders:'windrunners',defenders:'wardkeepers',swordsmen:'runeblades',catapults:'stormcallers',knights:'comet riders'};
function loreCopy(text){return text.replace(/\b(tribes?|city|cities|villages?|stars|population|civilizations?|technology|technologies|warriors?|archers|riders|defenders|swordsmen|catapults|knights)\b/gi,word=>{let next=LORE_COPY[word.toLowerCase()]||word;return word===word.toUpperCase()?next.toUpperCase():word[0]===word[0].toUpperCase()?next[0].toUpperCase()+next.slice(1):next})}
function loreNodes(root){
 const apply=n=>{if(!n.parentElement?.closest('script,style')){const next=loreCopy(n.data);if(next!==n.data)n.data=next}};
 if(root.nodeType===Node.TEXT_NODE){apply(root);return}
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode())apply(walker.currentNode);
}
new MutationObserver(records=>{for(const r of records){if(r.type==='characterData')loreNodes(r.target);else for(const n of r.addedNodes)loreNodes(n)}}).observe($('phone'),{childList:true,subtree:true,characterData:true});loreNodes($('phone'));

if(load()){updateUI();if(game.over)setTimeout(showResult,150);else if(game.turnState)resumeTurn();else if(upgradeQueue.length)setTimeout(showNextUpgrade,100)}else newGame({seed:578201});
if(saveNotice)setTimeout(()=>toast(saveNotice),180);
requestRender();
</script>
